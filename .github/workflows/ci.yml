name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/optportfolio?sslmode=disable
      E2E_TEST_PASSWORD: Local-E2E-Password-947!
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: optportfolio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optportfolio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser-test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check Django configuration and migrations
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity 1
      - name: Check frontend JavaScript
        run: node --check frontend/app.js
      - name: Run browser end-to-end tests
        run: npm run test:e2e
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
