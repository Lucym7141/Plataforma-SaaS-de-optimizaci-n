name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/optportfolio?sslmode=disable
      E2E_TEST_PASSWORD: Local-E2E-Password-947!
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: optportfolio
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d optportfolio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install browser-test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check Django configuration and migrations
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity 1
      - name: Lint Python
        run: ruff check backend tests
      - name: Lint JavaScript
        run: npx eslint .
      - name: Run browser end-to-end tests
        env:
          # Usa Redis y un worker real para cubrir la cola asíncrona.
          E2E_CELERY_WORKER: "true"
          CELERY_BROKER_URL: redis://127.0.0.1:6379/0
        run: npm run test:e2e
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create test configuration
        run: |
          cp .env.example .env
          sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" .env
          sed -i "s/^EMAIL_HOST=.*/EMAIL_HOST=localhost/" .env
          sed -i "s/^DJANGO_SECURE_HSTS_SECONDS=.*/DJANGO_SECURE_HSTS_SECONDS=60/" .env
      - name: Build and start the full stack
        run: docker compose up -d --build
      - name: Check HTTPS, static files, database and worker
        run: |
          for attempt in $(seq 1 30); do
            curl -fsk https://localhost/health/ && break
            sleep 2
          done
          curl -fsk https://localhost/health/
          curl -fsk -o /dev/null https://localhost/
          curl -fsk -o /dev/null https://localhost/static/app.js
          curl -fsk -o /dev/null https://localhost/static/react-build/react-app.js
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "308"
          docker compose exec -T worker celery -A config inspect ping --timeout 10
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
